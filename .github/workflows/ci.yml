name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# 같은 브랜치에 연달아 푸시하면 앞선 실행을 취소합니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 규칙 엔진 테스트
        run: npm test

      # 환경변수가 없으면 목 저장소로 빌드됩니다. 시트 인증 정보는 CI에 두지 않습니다.
      - name: 빌드
        run: npm run build
